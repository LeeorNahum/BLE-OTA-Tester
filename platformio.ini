; PlatformIO Project Configuration File for BLE OTA Tester
;
; Hardware tester for FastBLEOTA library using Unexpected Maker NanoS3
; Uses modular BLE pattern with build-time verification.
;
; Build: pio run
; Upload: pio run -t upload
; Monitor: pio device monitor
;
; The LED color changes each build based on UNIX_TIME, making it
; easy to verify that OTA actually changed the firmware.
;
; Copyright (c) 2024-2026 Leeor Nahum

[env:um_nanos3]
platform = espressif32
board = um_nanos3
framework = arduino

; Monitor settings
monitor_speed = 115200

; Library dependencies
lib_deps =
  unexpectedmaker/UMS3 Helper@^1.1.1
  https://github.com/LeeorNahum/FastBLEOTA.git#main
  ; For development: use local library via symlink (comment out GitHub URL above)
  ; FastBLEOTA=symlink://../../library/FastBLEOTA

; Build flags
build_flags =
  ; USB CDC for serial output on ESP32-S3
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  
  ; Build identification - changes each compile for OTA verification
  ; UNIX_TIME is a built-in PlatformIO variable
  '-D BUILD_TIMESTAMP=${UNIX_TIME}'
  '-D BUILD_MESSAGE="Build ${UNIX_TIME}"'
  
  ; FastBLEOTA configuration
  -D FBO_DEBUG
